[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frailty-toolkit"
version = "0.1.0"
description = "Source-available claims-based screening aid for the Medicaid medically frail exclusion (P.L. 119-21 sec. 71119; 42 CFR 435.554(c)(5)), with per-state configuration and a validation harness."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "Waymark, Inc."}, {name = "Sanjay Basu", email = "sanjay.basu@ucsf.edu"}]
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
build = ["openpyxl>=3.1"]
test = ["pytest>=7"]

[project.scripts]
frailty-toolkit = "frailty_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["frailty_toolkit*"]

[tool.setuptools.package-data]
"frailty_toolkit.definitions" = ["categories.yaml", "specs/*.yaml", "codelists/*.csv", "codelists/*.json"]
"frailty_toolkit.states" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
