# Virginia: Medicaid Expansion members.
extends: template
rule_version: "va-2026.09.0 (federal floor; CMS-2454-IFC 2026-06-03)"
state: VA
state_name: Virginia
program: "Medicaid Expansion"
requirement_start: "2027-01-01 for applicants; current members at their first renewal in 2027"
policy_status: >-
  DMAS says it will first use application, case record, and other information available to
  the state. As of 2026-09-29 DMAS had not published a claims method, look-back period, or
  code list for medical frailty; this config is the federal floor.
sources:
  - label: "DMAS Federal Medicaid Work Requirement FAQs (July 2026)"
    url: "https://www.dmas.virginia.gov/media/l10lgjxr/hr1-work-requirement-faqs.pdf"
    accessed: "2026-09-29"
  - label: "DMAS provider bulletin, H.R. 1 work requirement (updated 2026-09-04)"
    url: "https://vamedicaid.dmas.virginia.gov/bulletin/hr-1-federal-work-requirement-six-month-renewals-and-medicaid-eligibility-changes-non"
    accessed: "2026-09-29"
notes: >-
  Virginia is a plaintiff in Commonwealth of Massachusetts v. Oz. The DMAS FAQ lists the
  inpatient/nursing facility/institutional short-term hardship exception and notes it must be
  requested by the applicant.
related_provisions:
  short_term_hardship_inpatient: {enabled: true}
